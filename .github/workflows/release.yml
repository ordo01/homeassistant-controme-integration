name: "Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4.1.7"

      - name: "Derive the release version"
        id: version
        shell: "bash"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/controme"
          zip controme.zip -r ./

      - name: "Update the integration manifest version"
        shell: "bash"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("custom_components/controme/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = os.environ["RELEASE_VERSION"]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: "Package the integration"
        shell: "bash"
        run: |
          mkdir -p dist
          cd "${{ github.workspace }}"
          zip -r "${{ github.workspace }}/dist/controme.zip" . \
            -x '.git/*' '.github/*' '.venv/*' '.pytest_cache/*' 'dist/*'

      - name: "Create the GitHub release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: "bash"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${{ github.workspace }}/dist/controme.zip" --clobber
          else
            gh release create "${{ github.ref_name }}" "${{ github.workspace }}/dist/controme.zip" \
              --title "Release $VERSION" \
              --generate-notes
          fi
